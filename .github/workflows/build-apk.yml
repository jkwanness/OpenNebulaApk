name: Build APK

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk out/OpenNebula-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: OpenNebula-debug-apk
          path: out/OpenNebula-debug.apk

      - name: Publish to "latest-build" release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-build
          name: OpenNebula latest debug build
          prerelease: true
          make_latest: false
          body: |
            Debug APK built automatically from commit ${{ github.sha }}.
            Download OpenNebula-debug.apk on your phone and open it to install
            (allow "Install unknown apps" for your browser/files app when prompted).
          files: out/OpenNebula-debug.apk
